appId: com.pibuddy.app
productName: PiBuddy
directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # runtime 通过 extraResources 单独投递，不要再被打进 asar 一份
  - "!resources/**"

# 应用主代码打进 asar；pi 运行时不在 asar 内，而是由
# scripts/prepare-pi-runtime.mjs 产出后经 extraResources 原样投递到
# process.resourcesPath/pi-runtime，主进程只按 runtime-manifest.json 定位。
# 这样 pi 动态加载扩展/技能文件的路径全部落在普通文件系统上，
# 不再需要为了它牺牲整个产物的 asar 保护。
#
# 代价见 docs/product/ADR-0001-update-feed.md：pi-runtime 与 convert-worker
# 都不参与 asar 内的 blockmap 差分，它们体积一变就是整包重下。
asar: true
npmRebuild: false

# utilityProcess.fork 收的是一个磁盘上的真实文件路径，asar 里的虚拟路径
# 它打不开。转换 worker 因此必须外置；运行期的路径重写在
# src/main/preview/convert-host.ts 的 resolveWorkerPath() 里
# （app.asar → app.asar.unpacked）。漏掉任何一半的表现都一样：
# dev 全绿、单测全绿、装完之后预览整体不可用。
# 六个解析库被打进 out/main/chunks/ 下的动态 chunk（见 electron.vite.config.ts）。
# worker 被外置之后是从 app.asar.unpacked/out/main/ 起算相对路径去 import 它们的，
# 因此 chunks 必须一起外置 —— 只外置 worker 自己的表现是：worker 起得来，
# 第一次真正解析文档时报 ERR_MODULE_NOT_FOUND，而 dev 与单测全绿。
# 主进程（仍在 asar 内）import 同一批 chunk 不受影响：Electron 的 asar 层
# 会把「已 unpack」的成员读取自动重定向到 app.asar.unpacked。
asarUnpack:
  - out/main/convert-worker.js
  - out/main/chunks/**
  # node-pty（coding.terminal / ADR-0002 方案 B）：预编译原生二进制不能从 asar
  # 的虚拟路径执行，必须外置。Electron 的 asar 层会把「已 unpack」成员的读取自动
  # 重定向到 app.asar.unpacked，因此主进程 require("node-pty") 仍照常解析、其
  # .node/.dll/.exe 从 unpacked 加载。漏掉任一后缀的表现都是「装完之后开终端
  # 报 Module did not self-register / spawn-helper 找不到」，而 dev/单测全绿。
  - "**/node_modules/node-pty/**/*.node"
  - "**/node_modules/node-pty/**/*.dll"
  - "**/node_modules/node-pty/**/*.exe"

extraResources:
  - from: resources/pi-runtime
    to: pi-runtime
  # 能力包携带的 pi 资源（REQ-0001 R4.1）：manifest.piResources 声明的
  # prompts/skills/extensions 源文件，按 <capabilityId>/ 分目录。启用时由
  # capability-assets.ts 物化到 ~/.pi/agent，停用时收回。与 pi-runtime 同一
  # 投递面（不进 asar：files 里的 "!resources/**" 已排除）。
  - from: resources/capability-assets
    to: capability-assets

# extraResources 会跳过被复制目录里的 node_modules（显式 filter 也无效），
# 依赖必须由 afterPack 手动补齐，否则打包后 pi 启动即 ERR_MODULE_NOT_FOUND。
afterPack: scripts/after-pack.cjs

# electronDownload.mirror 刻意**不写在这里**。
#
# 硬编码第三方镜像意味着正式发布产物的 Electron 二进制来自一个未经供应链
# 审批的来源，而且没有任何开关能在发布时把它关掉。镜像改由
# scripts/build-config.mjs 按 PIBUDDY_USE_CN_MIRROR 注入 ELECTRON_MIRROR
# 环境变量，CI 的 release job 不设该变量，因此正式包恒走官方源。
#   开发机加速：  PIBUDDY_USE_CN_MIRROR=1 pnpm --filter @pibuddy/app dist

# 更新源。provider 固定 generic：客户端只认一个 URL，二进制里没有任何
# GitHub token —— 私有仓库的 token 一旦打进客户端，等于随包分发给所有人。
# 选型理由见 docs/product/ADR-0001-update-feed.md。
publish:
  provider: generic
  url: ${env.PIBUDDY_UPDATE_FEED_URL}
  channel: latest

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # per-user 安装（不写 Program Files、不需要 UAC）。electron-updater 的
  # NsisUpdater 在 perMachine: true 下每次更新都要弹 UAC，静默更新直接失效。
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  # dmg 是给人下载的，zip 是给 updater 用的。**缺 zip 时 macOS 自动更新
  # 整体不工作**：electron-updater 的 MacUpdater 只认 latest-mac.yml 里的
  # ZIP payload，而 latest-mac.yml 本身也只在产出 zip 时才会生成。
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: PiBuddy 需要使用麦克风来把你说的话转成文字

linux:
  # AppImage 走 electron-updater 自更新；deb 没有可靠的自更新路径，
  # 界面按 UPD-006 明确降级提示「请从官网下载新版本」，不伪装自动安装。
  target:
    - AppImage
    - deb
  category: Utility
