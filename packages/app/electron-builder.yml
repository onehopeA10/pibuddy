appId: com.pibuddy.app
productName: PiBuddy
directories:
  output: release

files:
  - out/**
  - package.json
  # runtime 通过 extraResources 单独投递，不要再被打进 asar 一份
  - "!resources/**"

# 应用主代码打进 asar；pi 运行时不在 asar 内，而是由
# scripts/prepare-pi-runtime.mjs 产出后经 extraResources 原样投递到
# process.resourcesPath/pi-runtime，主进程只按 runtime-manifest.json 定位。
# 这样 pi 动态加载扩展/技能文件的路径全部落在普通文件系统上，
# 不再需要为了它牺牲整个产物的 asar 保护。
asar: true
npmRebuild: false

extraResources:
  - from: resources/pi-runtime
    to: pi-runtime

# extraResources 会跳过被复制目录里的 node_modules（显式 filter 也无效），
# 依赖必须由 afterPack 手动补齐，否则打包后 pi 启动即 ERR_MODULE_NOT_FOUND。
afterPack: scripts/after-pack.cjs

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
  category: Utility
