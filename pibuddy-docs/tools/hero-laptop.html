<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PiBuddy laptop hero</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1600px;
        height: 1000px;
        overflow: hidden;
      }
      .stage {
        width: 1600px;
        height: 1000px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1000px 640px at 8% 0%, #ffb3d0 0%, transparent 55%),
          radial-gradient(820px 560px at 100% 8%, #8b6cff 0%, transparent 50%),
          linear-gradient(155deg, #ff8a4a 0%, #f25cbc 48%, #7a5bff 84%, #5a4be6 100%);
      }
      .laptop {
        width: 1220px;
        filter: drop-shadow(0 38px 70px rgba(28, 8, 40, 0.34));
      }
      .lid {
        background: #16181c;
        border-radius: 20px 20px 0 0;
        padding: 13px 13px 9px;
        position: relative;
      }
      .camera {
        position: absolute;
        top: 4px;
        left: 50%;
        width: 7px;
        height: 7px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #070809;
        box-shadow: inset 0 0 0 1px #3a3d44;
      }
      .screen {
        border-radius: 8px;
        overflow: hidden;
        background: #0c0c0e;
        line-height: 0;
      }
      .screen img {
        width: 100%;
        height: auto;
        display: block;
      }
      .hinge {
        height: 8px;
        background: linear-gradient(180deg, #d4d7dd, #b4b8c0);
      }
      .base {
        height: 28px;
        margin: 0 3.5%;
        background: linear-gradient(180deg, #f7f8fa 0%, #d8dbe1 60%, #b7bcc4 100%);
        clip-path: polygon(0 0, 100% 0, 96.8% 100%, 3.2% 100%);
        border-radius: 0 0 18px 18px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="laptop">
        <div class="lid">
          <div class="camera"></div>
          <div class="screen">
            <img src="../docs/public/screens/chat-workspace.png" alt="PiBuddy" />
          </div>
        </div>
        <div class="hinge"></div>
        <div class="base"></div>
      </div>
    </div>
  </body>
</html>
